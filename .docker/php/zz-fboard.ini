; Slim PHP defaults for the all-in-one container.
; Tunables are overridable via Docker ENV (PHP_MEMORY_LIMIT, etc.) if needed.

memory_limit = 256M

; php2shell CVE-2026-109618/109619 缓解：关闭 fatal 错误回溯（PHP 8.5+）。
; 根治靠基础镜像升级到 8.5.12+ 后重建镜像，此开关仅纵深防御。
fatal_error_backtraces = 0

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1

[swoole]
swoole.use_shortname = Off
