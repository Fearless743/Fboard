name: Docker Build and Publish

on:
  push:
    branches: ["master", "new-dev"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Docker 仓库名必须全小写。github.repository（Fearless743/Fboard）含大写 F，
      # 直接拼 tag 会触发 "invalid tag: repository name must be lowercase"，
      # 这里统一转小写后供后续 tag / build-context 使用。
      - name: Compute lowercase image name
        id: lower
        run: echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout admin SPA
        uses: actions/checkout@v4
        with:
          repository: Fearless743/Fboard-admin
          ref: main
          path: admin
          fetch-depth: 1

      - name: Build admin SPA
        working-directory: admin
        env:
          # admin 仓作为 Fboard 仓的子目录被 checkout，outDir 相对
          # admin/ 解析，必须指向 Fboard/public/assets/admin。
          FBOARD_PUBLIC_ASSETS_DIR: ../public/assets/admin
        run: |
          npm install -g bun
          bun install --frozen-lockfile
          bun run build
        # bun run build 会通过 vite.config.ts 的 outDir 把产物输出到
        # Fboard/public/assets/admin/，正好命中 Dockerfile 的 COPY 源。
        # 注意：这一步必须在 docker build 之前，否则 COPY 会拿到陈旧产物。

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
          driver-opts: |
            image=moby/buildkit:v0.20.0
            network=host

      - name: Free Disk Space
        run: |
          # 并行清理预装工具链与无用镜像，缩短墙钟时间
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          sudo docker image prune -af &
          wait

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lower.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=,enable=true
            type=raw,value=new,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.get_version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Get version
        id: get_version
        run: echo "version=$(git describe --tags --always)" >> $GITHUB_OUTPUT

      - name: Update version in app.php
        run: |
          VERSION=$(date '+%Y%m%d')-$(git rev-parse --short HEAD)
          sed -i "s/'version' => '.*'/'version' => '$VERSION'/g" config/app.php
          echo "Updated version to: $VERSION"

      # ---------------------------------------------------------------------------
      # Composer 依赖共享：多架构（amd64/arm64）构建共用一次 composer install。
      # 1. 此处以单平台 amd64 构建 Dockerfile 的 vendor stage 并推送为共享镜像
      #    <image>:vendor-cache。vendor stage 的 cache-from 复用 build-push-action
      #    写入 gha 的层缓存，composer.lock 不变时直接命中（拉一个已存在镜像，
      #    秒级完成，不再执行 composer install）。
      # 2. 下方主构建通过命名 build context 传入 `vendor=docker-image://<共享镜像>`，
      #    BuildKit 用该镜像覆盖同名 vendor stage（只取 /www/vendor），
      #    两个平台都不再执行 composer install。
      # 3. composer.json/lock 变更时，vendor stage 指令变化导致 gha 缓存 miss，
      #    此步重新 composer install 并更新共享镜像，主构建自动拿到新 vendor。
      # 注：vendor 必须与运行环境同基础镜像（phpswoole/swoole:php8.5-alpine），
      # 否则 FROM 匹配不上。依赖为纯 PHP，跨架构通用；若将来引入平台相关包
      # （C 扩展、预编译二进制），需重新评估此共享。
      # ---------------------------------------------------------------------------
      - name: Build and push shared vendor image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          target: vendor
          # vendor 镜像本体已是跨构建的“层缓存”；这里再配 registry 缓存
          # 可让 gha 之外的层（基础镜像）也命中，兼容两种缓存来源。
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.lower.outputs.image }}:buildcache
            type=gha
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.lower.outputs.image }}:buildcache,mode=max
          tags: ${{ env.REGISTRY }}/${{ steps.lower.outputs.image }}:vendor-cache
          provenance: false
          outputs: type=registry,push=true

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # registry 缓存（存 ghcr.io）比 gha 缓存更适合多架构：
          # arm64 扩展编译层可跨 run 命中，避免每次现场编译 5 分钟。
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.lower.outputs.image }}:buildcache
            type=gha
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.lower.outputs.image }}:buildcache,mode=max
          # 命名 build context：共享 vendor 镜像覆盖 Dockerfile 同名 vendor stage。
          # BuildKit 直接取该镜像 /www/vendor，两个架构共享同一份 composer 依赖，
          # vendor stage（含 composer install）不再执行。
          build-contexts: vendor=docker-image://${{ env.REGISTRY }}/${{ steps.lower.outputs.image }}:vendor-cache
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=registry,push=true
          allow: |
            network.host

