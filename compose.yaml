# Default all-in-one deployment: a single container covers web (Octane),
# Horizon queue workers, and the node WebSocket server via supervisord.
# Redis and Caddy also run inside the same image.
#
# Suitable for: bare docker compose, aaPanel + Docker manager, custom reverse
# proxies (nginx, Caddy on host, Cloudflare Tunnel, etc.) that talk to
# 127.0.0.1:7001 on the host.
#
# Optional templates (copy over this file if needed):
#   compose.host.sample.yaml     - network_mode: host (aaPanel native openresty)
#   compose.1panel.sample.yaml   - join 1Panel's external network for MySQL/Redis
#   compose.split.sample.yaml    - split web/horizon/ws-server for K8s / scaling
services:
  xboard:
    image: ghcr.io/fearless743/fboard:latest
    restart: unless-stopped
    ports:
      - "7001:7001"
    volumes:
      - ./.env:/www/.env
      - ./.docker/.data/:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./storage/theme:/www/storage/theme
      - ./plugins:/www/plugins
      - redis-data:/data
    environment:
      - RESOURCE_PROFILE=balanced      # minimal | balanced | performance | auto
      - ENABLE_HORIZON=true
      - docker=true

volumes:
  redis-data:
